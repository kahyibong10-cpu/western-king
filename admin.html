<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Western King - Admin</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #333;
}

/* HEADER */

.header {
    background: linear-gradient(135deg, #d62828, #f77f00);
    color: white;
    padding: 25px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 32px;
}

.header p {
    margin: 8px 0 0;
}

/* CONTAINER */

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

/* DASHBOARD */

.dashboard {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    text-align: center;
}

.card h3 {
    margin: 0;
    color: #666;
    font-size: 16px;
}

.card .number {
    margin-top: 10px;
    font-size: 30px;
    font-weight: bold;
    color: #d62828;
}

/* CONNECTION */

.connection {
    text-align: center;
    margin-bottom: 20px;
}

.connected {
    display: inline-block;
    background: #d4edda;
    color: #155724;
    padding: 10px 18px;
    border-radius: 20px;
    font-weight: bold;
}

.error {
    display: inline-block;
    background: #f8d7da;
    color: #721c24;
    padding: 10px 18px;
    border-radius: 20px;
    font-weight: bold;
}

/* ORDERS */

.section-title {
    font-size: 25px;
    margin-bottom: 15px;
}

.order {
    background: white;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    border-bottom: 1px solid #eee;
    padding-bottom: 12px;
    margin-bottom: 15px;
}

.order-number {
    font-size: 22px;
    font-weight: bold;
    color: #d62828;
}

.order-info {
    line-height: 1.7;
}

.items {
    margin-top: 15px;
}

.item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px dashed #ddd;
}

.total {
    text-align: right;
    font-size: 22px;
    font-weight: bold;
    color: #d62828;
    margin-top: 15px;
}

/* STATUS */

.status {
    padding: 8px 12px;
    border-radius: 20px;
    font-weight: bold;
    display: inline-block;
}

.status-new {
    background: #fff3cd;
    color: #856404;
}

.status-preparing {
    background: #cce5ff;
    color: #004085;
}

.status-ready {
    background: #d4edda;
    color: #155724;
}

.status-completed {
    background: #e2e3e5;
    color: #383d41;
}

/* BUTTONS */

.controls {
    margin-top: 15px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

select {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

button {
    border: none;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.refresh-button {
    background: #007bff;
    color: white;
}

.delete-button {
    background: #dc3545;
    color: white;
}

button:hover {
    opacity: 0.85;
}

/* EMPTY */

.empty {
    background: white;
    padding: 40px;
    text-align: center;
    border-radius: 15px;
    color: #777;
}

/* LOADING */

.loading {
    text-align: center;
    padding: 30px;
}

/* MOBILE */

@media (max-width: 800px) {

    .dashboard {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 500px) {

    .dashboard {
        grid-template-columns: 1fr;
    }

    .header h1 {
        font-size: 25px;
    }

    .order-number {
        font-size: 19px;
    }

}

</style>
</head>

<body>

<div class="header">

    <h1>👨‍💼 Western King Admin</h1>

    <p>Order Management Dashboard</p>

</div>


<div class="container">

    <!-- CONNECTION -->

    <div class="connection">

        <span id="connectionStatus" class="connected">
            🟢 Firebase Connected
        </span>

    </div>


    <!-- DASHBOARD -->

    <div class="dashboard">

        <div class="card">

            <h3>Total Orders</h3>

            <div class="number" id="totalOrders">
                0
            </div>

        </div>


        <div class="card">

            <h3>New Orders</h3>

            <div class="number" id="newOrders">
                0
            </div>

        </div>


        <div class="card">

            <h3>Completed</h3>

            <div class="number" id="completedOrders">
                0
            </div>

        </div>


        <div class="card">

            <h3>Total Revenue</h3>

            <div class="number" id="totalRevenue">
                RM 0.00
            </div>

        </div>

    </div>


    <!-- REFRESH -->

    <div style="margin-bottom:20px;">

        <button class="refresh-button" onclick="loadOrders()">
            🔄 Refresh Orders
        </button>

    </div>


    <!-- ORDERS -->

    <h2 class="section-title">
        📦 Customer Orders
    </h2>


    <div id="ordersContainer">

        <div class="loading">
            Loading orders...
        </div>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";


import {
    getFirestore,
    collection,
    onSnapshot,
    doc,
    updateDoc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey: "AIzaSyDnRYJQTPVFbeMjTFNwiBn7tfRbMRYACWQ",

    authDomain: "western-king-restaurant.firebaseapp.com",

    projectId: "western-king-restaurant",

    storageBucket: "western-king-restaurant.firebasestorage.app",

    messagingSenderId: "866508888526",

    appId: "1:866508888526:web:ad4c149c431fd5d286339f"

};


/* =========================
   START FIREBASE
========================= */

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================
   LOAD ORDERS
========================= */

let unsubscribe = null;


function loadOrders() {

    const container =
        document.getElementById("ordersContainer");


    container.innerHTML =
        '<div class="loading">Loading orders...</div>';


    if (unsubscribe) {
        unsubscribe();
    }


    try {

        const ordersRef = collection(db, "orders");


        unsubscribe = onSnapshot(

            ordersRef,

            (snapshot) => {

                let orders = [];


                snapshot.forEach((documentSnapshot) => {

                    orders.push({

                        id: documentSnapshot.id,

                        ...documentSnapshot.data()

                    });

                });


                /* SORT NEWEST FIRST */

                orders.sort((a, b) => {

                    let timeA = getOrderTime(a);

                    let timeB = getOrderTime(b);

                    return timeB - timeA;

                });


                updateDashboard(orders);

                displayOrders(orders);

            },


            (error) => {

                console.error(error);

                document.getElementById(
                    "connectionStatus"
                ).className = "error";


                document.getElementById(
                    "connectionStatus"
                ).textContent =
                    "🔴 Firebase Error";


                document.getElementById(
                    "ordersContainer"
                ).innerHTML = `

                    <div class="empty">

                        ❌ Cannot load orders.

                        <br><br>

                        Please check your Firestore rules.

                    </div>

                `;

            }

        );

    }

    catch (error) {

        console.error(error);

    }

}


/* =========================
   GET TIME
========================= */

function getOrderTime(order) {

    if (order.createdAt && order.createdAt.toMillis) {

        return order.createdAt.toMillis();

    }


    if (order.time) {

        let time = new Date(order.time).getTime();

        if (!isNaN(time)) {

            return time;

        }

    }


    return 0;

}


/* =========================
   DASHBOARD
========================= */

function updateDashboard(orders) {

    let totalOrders = orders.length;

    let newOrders = 0;

    let completedOrders = 0;

    let revenue = 0;


    orders.forEach(order => {

        let status =
            String(order.status || "NEW").toUpperCase();


        if (status === "NEW") {

            newOrders++;

        }


        if (status === "COMPLETED") {

            completedOrders++;

        }


        let total =
            Number(order.total || 0);


        if (!isNaN(total)) {

            revenue += total;

        }

    });


    document.getElementById(
        "totalOrders"
    ).textContent = totalOrders;


    document.getElementById(
        "newOrders"
    ).textContent = newOrders;


    document.getElementById(
        "completedOrders"
    ).textContent = completedOrders;


    document.getElementById(
        "totalRevenue"
    ).textContent =
        "RM " + revenue.toFixed(2);

}


/* =========================
   DISPLAY ORDERS
========================= */

function displayOrders(orders) {

    const container =
        document.getElementById("ordersContainer");


    if (orders.length === 0) {

        container.innerHTML = `

            <div class="empty">

                📭 No orders yet.

                <br><br>

                Customer orders will appear here automatically.

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    orders.forEach(order => {

        const orderDiv =
            document.createElement("div");


        orderDiv.className = "order";


        let status =
            String(order.status || "NEW").toUpperCase();


        let statusClass =
            "status-new";


        if (status === "PREPARING") {

            statusClass = "status-preparing";

        }

        else if (status === "READY") {

            statusClass = "status-ready";

        }

        else if (status === "COMPLETED") {

            statusClass = "status-completed";

        }


        /* ITEMS */

        let itemsHTML = "";


        if (Array.isArray(order.items)) {

            order.items.forEach(item => {

                let name =
                    item.name || "Unknown Item";


                let quantity =
                    Number(item.quantity || 0);


                let subtotal =
                    Number(
                        item.subtotal ||
                        (
                            Number(item.price || 0)
                            * quantity
                        )
                    );


                itemsHTML += `

                    <div class="item">

                        <span>

                            ${escapeHTML(name)}

                            × ${quantity}

                        </span>

                        <span>

                            RM ${subtotal.toFixed(2)}

                        </span>

                    </div>

                `;

            });

        }


        /* CUSTOMER */

        let customer =
            escapeHTML(
                order.customer || "Unknown"
            );


        /* ORDER TYPE */

        let orderType =
            escapeHTML(
                order.orderType || "-"
            );


        /* TABLE */

        let tableText = "";


        if (orderType === "Dine In") {

            tableText =
                "🍽️ Table: " +
                escapeHTML(order.table || "-");

        }

        else {

            tableText =
                "🥡 Take Away";

        }


        /* DESCRIPTION */

        let descriptionHTML = "";


        if (order.description) {

            descriptionHTML = `

                <div>

                    📝 <b>Note:</b>

                    ${escapeHTML(
                        order.description
                    )}

                </div>

            `;

        }


        /* TIME */

        let orderTime = "";


        if (order.createdAt &&
            order.createdAt.toDate) {

            orderTime =
                order.createdAt
                    .toDate()
                    .toLocaleString();

        }

        else if (order.time) {

            orderTime =
                escapeHTML(
                    String(order.time)
                );

        }

        else {

            orderTime = "-";

        }


        orderDiv.innerHTML = `

            <div class="order-header">

                <div>

                    <div class="order-number">

                        ${escapeHTML(
                            order.orderNumber ||
                            "NO NUMBER"
                        )}

                    </div>

                    <small>

                        ${orderTime}

                    </small>

                </div>


                <div>

                    <span class="status ${statusClass}">

                        ${status}

                    </span>

                </div>

            </div>


            <div class="order-info">

                👤 <b>Customer:</b>
                ${customer}

                <br>

                📦 <b>Order Type:</b>
                ${orderType}

                <br>

                ${tableText}

                <br>

                ${descriptionHTML}

            </div>


            <div class="items">

                <h3>🍔 Items</h3>

                ${itemsHTML}

            </div>


            <div class="total">

                Total:
                RM ${Number(
                    order.total || 0
                ).toFixed(2)}

            </div>


            <div class="controls">

                <select
                    onchange="changeStatus(
                        '${order.id}',
                        this.value
                    )"
                >

                    <option
                        value="NEW"
                        ${status === "NEW" ? "selected" : ""}
                    >
                        🆕 NEW
                    </option>


                    <option
                        value="PREPARING"
                        ${status === "PREPARING" ? "selected" : ""}
                    >
                        👨‍🍳 PREPARING
                    </option>


                    <option
                        value="READY"
                        ${status === "READY" ? "selected" : ""}
                    >
                        ✅ READY
                    </option>


                    <option
                        value="COMPLETED"
                        ${status === "COMPLETED" ? "selected" : ""}
                    >
                        ✔️ COMPLETED
                    </option>

                </select>


                <button
                    class="delete-button"
                    onclick="deleteOrder('${order.id}')"
                >

                    🗑️ Delete

                </button>

            </div>

        `;


        container.appendChild(orderDiv);

    });

}


/* =========================
   CHANGE STATUS
========================= */

window.changeStatus = async function(
    orderId,
    newStatus
) {

    try {

        await updateDoc(

            doc(db, "orders", orderId),

            {
                status: newStatus
            }

        );

    }

    catch (error) {

        console.error(error);

        alert(
            "Failed to update order status."
        );

    }

};


/* =========================
   DELETE ORDER
========================= */

window.deleteOrder = async function(
    orderId
) {

    const confirmDelete =
        confirm(
            "Delete this order?"
        );


    if (!confirmDelete) {

        return;

    }


    try {

        await deleteDoc(

            doc(db, "orders", orderId)

        );

    }

    catch (error) {

        console.error(error);

        alert(
            "Failed to delete order."
        );

    }

};


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================
   START
========================= */

loadOrders();


</script>

</body>
</html>
