
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Western King - Admin Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f5f9;
    color: #202536;
}

header {
    background: #172033;
    color: white;
    padding: 22px 20px;
}

header h1 {
    margin: 0 0 8px;
    font-size: 25px;
}

header p {
    margin: 0;
    color: #cbd5e1;
}

.container {
    max-width: 1250px;
    margin: auto;
    padding: 20px;
}

.connection {
    padding: 12px 15px;
    background: white;
    border-radius: 10px;
    margin-bottom: 20px;
    border: 1px solid #e1e5ed;
    font-size: 14px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 15px;
    margin-bottom: 22px;
}

.stat {
    background: white;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #e1e5ed;
}

.stat p {
    margin: 0 0 12px;
    color: #64748b;
    font-size: 14px;
}

.stat h2 {
    margin: 0;
    font-size: 27px;
    overflow-wrap: anywhere;
}

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

input, select, button {
    font: inherit;
    padding: 11px 13px;
    border-radius: 8px;
    border: 1px solid #d4dae5;
}

input, .toolbar select {
    background: white;
}

button {
    cursor: pointer;
    background: #172033;
    color: white;
    border: none;
}

button:hover {
    opacity: 0.88;
}

.orders {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
}

.order {
    background: white;
    border: 1px solid #e1e5ed;
    border-radius: 12px;
    padding: 18px;
    min-width: 0;
}

.order-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
    flex-wrap: wrap;
    border-bottom: 1px solid #edf0f5;
    padding-bottom: 12px;
    margin-bottom: 12px;
}

.order h3 {
    margin: 0 0 6px;
    overflow-wrap: anywhere;
}

.muted {
    color: #64748b;
    font-size: 13px;
}

.status {
    font-size: 12px;
    font-weight: bold;
    padding: 6px 9px;
    border-radius: 20px;
    background: #e2e8f0;
    color: #334155;
}

.status.NEW {
    background: #dbeafe;
    color: #1d4ed8;
}

.status.PREPARING {
    background: #fef3c7;
    color: #92400e;
}

.status.READY {
    background: #dcfce7;
    color: #166534;
}

.status.COMPLETED {
    background: #e2e8f0;
    color: #334155;
}

.details {
    line-height: 1.8;
    font-size: 14px;
    overflow-wrap: anywhere;
}

.items {
    background: #f8fafc;
    border-radius: 8px;
    padding: 12px;
    margin: 12px 0;
}

.item-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 5px 0;
    font-size: 14px;
}

.total {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 19px;
    font-weight: bold;
    padding: 12px 0;
}

.order-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
}

.order-actions select {
    flex: 1;
    min-width: 140px;
    background: white;
}

.empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 45px 15px;
    background: white;
    border-radius: 12px;
    color: #64748b;
}

.error {
    color: #b91c1c;
}

@media (max-width: 750px) {
    .stats {
        grid-template-columns: 1fr;
    }

    .orders {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 12px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🍗 Western King</h1>
    <p>Restaurant Admin Dashboard</p>
</header>

<main class="container">

    <div class="connection" id="connection">
        🟡 Connecting to Firebase...
    </div>

    <section class="stats">
        <div class="stat">
            <p>Total Orders</p>
            <h2 id="totalOrders">0</h2>
        </div>

        <div class="stat">
            <p>New / Preparing Orders</p>
            <h2 id="pendingOrders">0</h2>
        </div>

        <div class="stat">
            <p>Completed Order Revenue</p>
            <h2 id="revenue">RM 0.00</h2>
        </div>
    </section>

    <div class="toolbar">
        <input
            id="search"
            type="search"
            placeholder="Search order number or customer..."
        >

        <select id="filter">
            <option value="ALL">All Orders</option>
            <option value="NEW">New</option>
            <option value="PREPARING">Preparing</option>
            <option value="READY">Ready</option>
            <option value="COMPLETED">Completed</option>
        >

        </select>

        <button id="refreshButton" type="button">
            Refresh Orders
        </button>
    </div>

    <section id="orders" class="orders">
        <div class="empty">Loading orders...</div>
    </section>

</main>

<script type="module">
import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
    getFirestore,
    collection,
    onSnapshot,
    query,
    orderBy,
    updateDoc,
    doc
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

/*
IMPORTANT:
Copy the EXACT firebaseConfig object from restaurant.html.
Do not use example API keys or create a different Firebase project.
*/

const firebaseConfig = {
    apiKey: "PASTE_YOUR_API_KEY_HERE",
    authDomain: "western-king-restaurant.firebaseapp.com",
    projectId: "western-king-restaurant",
    storageBucket: "PASTE_YOUR_STORAGE_BUCKET_HERE",
    messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID_HERE",
    appId: "PASTE_YOUR_APP_ID_HERE"
};

const connection = document.getElementById("connection");
const ordersContainer = document.getElementById("orders");
const searchInput = document.getElementById("search");
const filterSelect = document.getElementById("filter");

let db;
let allOrders = [];
let unsubscribe = null;
let isConnected = false;

const money = value =>
    "RM " + Number(value || 0).toFixed(2);

const escapeHTML = value =>
    String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);

function formatTime(value) {
    if (!value) return "Time unavailable";

    let date;

    if (typeof value.toDate === "function") {
        date = value.toDate();
    } else {
        date = new Date(value);
    }

    if (Number.isNaN(date.getTime())) {
        return "Time unavailable";
    }

    return date.toLocaleString();
}

function getItems(order) {
    if (!Array.isArray(order.items)) return [];

    return order.items.map(item => {
        const quantity = Number(item.quantity || 0);
        const price = Number(item.price || 0);

        const subtotal = item.subtotal != null
            ? Number(item.subtotal)
            : price * quantity;

        return {
            name: item.name || item.title || "Food item",
            quantity,
            price,
            subtotal
        };
    });
}

function getStatus(order) {
    const validStatuses = [
        "NEW", "PREPARING", "READY", "COMPLETED"
    ];

    const status = String(order.status || "NEW").toUpperCase();

    return validStatuses.includes(status) ? status : "NEW";
}

function renderStats() {
    document.getElementById("totalOrders").textContent =
        allOrders.length;

    document.getElementById("pendingOrders").textContent =
        allOrders.filter(order =>
            ["NEW", "PREPARING"].includes(getStatus(order))
        ).length;

    const completedRevenue = allOrders
        .filter(order => getStatus(order) === "COMPLETED")
        .reduce((sum, order) => sum + Number(order.total || 0), 0);

    document.getElementById("revenue").textContent =
        money(completedRevenue);
}

function renderOrders() {
    const keyword = searchInput.value.trim().toLowerCase();
    const selectedStatus = filterSelect.value;

    const filtered = allOrders.filter(order => {
        const status = getStatus(order);

        const searchable = [
            order.orderNumber,
            order.customer,
            order.orderType,
            order.table
        ].join(" ").toLowerCase();

        return (
            (selectedStatus === "ALL" || status === selectedStatus) &&
            searchable.includes(keyword)
        );
    });

    if (filtered.length === 0) {
        ordersContainer.innerHTML = `
            <div class="empty">
                No orders found.<br>
                Customer orders will appear here when saved
                to the same Firestore database.
            </div>
        `;
        return;
    }

    ordersContainer.innerHTML = filtered.map(order => {
        const status = getStatus(order);
        const items = getItems(order);

        const itemsHTML = items.length
            ? items.map(item => `
                <div class="item-row">
                    <span>
                        ${escapeHTML(item.name)}
                        × ${item.quantity}
                        <br>
                        <span class="muted">
                            ${money(item.price)} each
                        </span>
                    </span>
                    <strong>${money(item.subtotal)}</strong>
                </div>
            `).join("")
            : `<div class="muted">No item details available.</div>`;

        const orderNumber =
            order.orderNumber || order.id;

        const orderType = String(order.orderType || "Not specified");

        const tableText = orderType.toLowerCase().includes("take")
            ? "Not applicable"
            : (order.table || "Not specified");

        return `
            <article class="order">
                <div class="order-top">
                    <div>
                        <h3>Order #${escapeHTML(orderNumber)}</h3>
                        <div class="muted">
                            ${escapeHTML(formatTime(order.createdAt || order.time))}
                        </div>
                    </div>
                    <span class="status ${status}">
                        ${status}
                    </span>
                </div>

                <div class="details">
                    <strong>Customer:</strong>
                    ${escapeHTML(order.customer || "Not specified")}
                    <br>

                    <strong>Order Type:</strong>
                    ${escapeHTML(orderType)}
                    <br>

                    <strong>Table:</strong>
                    ${escapeHTML(tableText)}
                    <br>

                    <strong>Remarks:</strong>
                    ${escapeHTML(order.description || "None")}
                </div>

                <div class="items">
                    ${itemsHTML}
                </div>

                <div class="total">
                    <span>Total</span>
                    <span>${money(order.total)}</span>
                </div>

                <div class="order-actions">
                    <select
                        class="statusSelect"
                        data-id="${escapeHTML(order.id)}"
                        aria-label="Change order status"
                    >
                        <option value="NEW" ${status === "NEW" ? "selected" : ""}>
                            NEW
                        </option>
                        <option value="PREPARING" ${status === "PREPARING" ? "selected" : ""}>
                            PREPARING
                        </option>
                        <option value="READY" ${status === "READY" ? "selected" : ""}>
                            READY
                        </option>
                        <option value="COMPLETED" ${status === "COMPLETED" ? "selected" : ""}>
                            COMPLETED
                        </option>
                    </select>

                    <button
                        class="updateButton"
                        data-id="${escapeHTML(order.id)}"
                        type="button"
                    >
                        Update Status
                    </button>
                </div>
            </article>
        `;
    }).join("");
}

function startListening() {
    if (unsubscribe) unsubscribe();

    isConnected = false;
    connection.textContent = "🟡 Connecting to Firestore...";

    const ordersQuery = query(
        collection(db, "orders"),
        orderBy("createdAt", "desc")
    );

    unsubscribe = onSnapshot(
        ordersQuery,
        snapshot => {
            isConnected = true;

            connection.textContent =
                "🟢 Firebase Connected — Live orders enabled";

            allOrders = snapshot.docs.map(document => ({
                id: document.id,
                ...document.data()
            }));

            renderStats();
            renderOrders();
        },
        error => {
            isConnected = false;

            connection.innerHTML =
                `<span class="error">🔴 Firebase Error: ${
                    escapeHTML(error.message)
                }</span>`;

            console.error("Firestore listener error:", error);
        }
    );
}

async function updateOrderStatus(id, status) {
    if (!isConnected) {
        alert("Firebase is not connected.");
        return;
    }

    try {
        await updateDoc(doc(db, "orders", id), {
            status: status
        });

        alert("Order status updated successfully!");
    } catch (error) {
        console.error("Status update failed:", error);

        alert(
            "Could not update order status. Check Firestore permissions."
        );
    }
}

ordersContainer.addEventListener("click", async event => {
    const button = event.target.closest(".updateButton");

    if (!button) return;

    const id = button.dataset.id;
    const select = ordersContainer.querySelector(
        `.statusSelect[data-id="${CSS.escape(id)}"]`
    );

    if (!select) return;

    button.disabled = true;

    try {
        await updateOrderStatus(id, select.value);
    } finally {
        button.disabled = false;
    }
});

searchInput.addEventListener("input", renderOrders);
filterSelect.addEventListener("change", renderOrders);

document.getElementById("refreshButton").addEventListener("click", () => {
    if (db) startListening();
});

try {
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    startListening();
} catch (error) {
    connection.innerHTML =
        `<span class="error">Firebase setup error: ${
            escapeHTML(error.message)
        }</span>`;

    console.error(error);
}
</script>

</body>
</html>
