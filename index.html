<body>


<div class="header">

<p>📋 Admin Order Management System</p>

<div class="container">


<!-- ================= DASHBOARD ================= -->

<div class="dashboard">

<div class="stat">

<h2 id="newCount">0</h2>

<p>🆕 NEW</p>

</div>


<div class="stat">

<h2 id="preparingCount">0</h2>

<p>👨‍🍳 PREPARING</p>

</div>


<div class="stat">

<h2 id="readyCount">0</h2>

<p>🔔 READY</p>

</div>


<div class="stat">

<h2 id="completedCount">0</h2>

<p>✅ COMPLETED</p>

</div>

            <p>💰 TOTAL REVENUE</p>

        </div>

</div>


<button

onclick="loadOrders()">

🔄 Refresh Orders

</button>


<div
id="errorBox"
class="error">

</div>


<!-- ================= ORDERS ================= -->

<div
id="orders"
class="orders">

<div class="empty">

⏳ Loading orders...

</div>

</div>


</div>


<!-- ================= FIREBASE ================= -->

<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";


import {
    getFirestore,
    collection,
    onSnapshot,
    updateDoc,
    doc
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";



/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {

    apiKey: "AIzaSyDnRYJQTPVFbeMjTFNwiBn7tfRbMRYACWQ",

    authDomain: "western-king-restaurant.firebaseapp.com",

    projectId: "western-king-restaurant",

    storageBucket: "western-king-restaurant.firebasestorage.app",

    messagingSenderId: "866508888526",

    appId: "1:866508888526:web:ad4c149c431fd5d286339f6"

};



/* ================= INITIALIZE ================= */

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



let allOrders = [];



/* ================= LOAD ORDERS ================= */

function loadOrders() {

    const ordersRef = collection(db, "orders");


    onSnapshot(

        ordersRef,

        (snapshot) => {

            allOrders = [];


            snapshot.forEach((document) => {

                allOrders.push({

                    id: document.id,

                    ...document.data()

                });

            });


            /*

            Sort newest order first.

            */

            allOrders.sort((a, b) => {

                let timeA = 0;

                let timeB = 0;


                if (a.createdAt) {

                    timeA =
                        a.createdAt.seconds || 0;

                }


                if (b.createdAt) {

                    timeB =
                        b.createdAt.seconds || 0;

                }


                return timeB - timeA;

            });


            displayOrders();

            updateDashboard();


            document.getElementById("errorBox")
                .style.display = "none";

        },


        (error) => {

            console.error(error);


            const errorBox =
                document.getElementById("errorBox");


            errorBox.innerText =
                "❌ Firebase Error: " +
                error.message;


            errorBox.style.display = "block";

        }

    );

}



/* ================= DISPLAY ORDERS ================= */

function displayOrders() {

    const box =
        document.getElementById("orders");


    box.innerHTML = "";


    if (allOrders.length === 0) {

        box.innerHTML = `

            <div class="empty">

                <h2>📭 No Orders</h2>

                <p>

                There are currently no customer orders.

                </p>

            </div>

        `;

        return;

    }



    allOrders.forEach((order) => {

        let itemsHTML = "";


        if (order.items &&
            Array.isArray(order.items)) {


            order.items.forEach((item) => {

                itemsHTML += `

                    <div class="item">

                        🍴 <b>
                        ${escapeHTML(item.name)}
                        </b>

                        × ${item.quantity}

                        &nbsp;&nbsp;

                        RM ${Number(item.subtotal || 0)
                            .toFixed(2)}

                    </div>

                `;

            });

        }



        let status =
            order.status || "NEW";


        let time =
            order.time || "Unknown time";


        let total =
            Number(order.total || 0);



        box.innerHTML += `

            <div class="order-card">


                <div class="order-top">


                    <div>

                        <div class="order-number">

                            #${escapeHTML(
                                order.orderNumber ||
                                order.id
                            )}

                        </div>


                        <div class="customer">

                            👤

                            <b>
                            ${escapeHTML(
                                order.customer ||
                                "Customer"
                            )}
                            </b>

                        </div>


                    </div>


                    <div>

                        <span
                        class="status status-${status}">

                            ${status}

                        </span>

                    </div>


                </div>



                <div class="order-info">


                    <p>

                        🪑

                        <b>Table:</b>

                        ${escapeHTML(
                            String(
                                order.table || "-"
                            )
                        )}

                    </p>


                    <p>

                        🕐

                        <b>Time:</b>

                        ${escapeHTML(time)}

                    </p>


                    <hr>


                    <h3>🍴 Order Items</h3>


                    ${itemsHTML}


                    <div class="total">

                        💰 Total:

                        RM ${total.toFixed(2)}

                    </div>


                </div>



                <div class="buttons">


                    ${
                        status === "NEW"

                        ?

                        `

                        <button

                        class="action prepare"

                        onclick="changeStatus(
                            '${order.id}',
                            'PREPARING'
                        )">

                        👨‍🍳 Accept Order

                        </button>

                        `

                        :

                        ""

                    }



                    ${
                        status === "PREPARING"

                        ?

                        `

                        <button

                        class="action ready"

                        onclick="changeStatus(
                            '${order.id}',
                            'READY'
                        )">

                        🔔 Mark Ready

                        </button>

                        `

                        :

                        ""

                    }



                    ${
                        status === "READY"

                        ?

                        `

                        <button

                        class="action complete"

                        onclick="changeStatus(
                            '${order.id}',
                            'COMPLETED'
                        )">

                        ✅ Complete

                        </button>

                        `

                        :

                        ""

                    }



                    ${
                        status !== "COMPLETED" &&
                        status !== "CANCELLED"

                        ?

                        `

                        <button

                        class="action cancel"

                        onclick="changeStatus(
                            '${order.id}',
                            'CANCELLED'
                        )">

                        ❌ Cancel

                        </button>

                        `

                        :

                        ""

                    }


                </div>


            </div>

        `;

    });

}



/* ================= CHANGE STATUS ================= */

window.changeStatus = async function(
    orderId,
    newStatus
) {

    try {


        await updateDoc(

            doc(db, "orders", orderId),

            {

                status: newStatus

            }

        );


        console.log(

            "Order updated:",

            orderId,

            newStatus

        );


    }

    catch (error) {

        console.error(error);


        alert(

            "❌ Failed to update order:\n\n" +

            error.message

        );

    }

};



/* ================= DASHBOARD ================= */

function updateDashboard() {

    let newCount = 0;

    let preparingCount = 0;

    let readyCount = 0;

    let completedCount = 0;

    let totalRevenue = 0;


    allOrders.forEach((order) => {

        const status =
            order.status || "NEW";


        if (status === "NEW") {

            newCount++;

        }

        else if (status === "PREPARING") {

            preparingCount++;

        }

        else if (status === "READY") {

            readyCount++;

        }

        else if (status === "COMPLETED") {

            completedCount++;

            // Only completed orders count as revenue.
            totalRevenue += Number(order.total || 0);

        }

    });


    document.getElementById("newCount")
        .innerText = newCount;


    document.getElementById("preparingCount")
        .innerText = preparingCount;


    document.getElementById("readyCount")
        .innerText = readyCount;


    document.getElementById("completedCount")
        .innerText = completedCount;

    document.getElementById("totalRevenue")
        .innerText = "RM " + totalRevenue.toFixed(2);

}



/* ================= SECURITY ================= */

function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}



/* ================= START ================= */

loadOrders();


</script>


</body>

</html>
